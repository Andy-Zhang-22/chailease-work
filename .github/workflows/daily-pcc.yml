# 每天抓前一天的政府電子採購網決標公告（經 g0v 標案 API，pcc-api.openfun.app），只留得標廠商地址在新北市、臺北市、
# 組織型態是公司登記或商業登記的，寫成 leads/pcc/pcc.csv（一家一列，跨期同統編不重複）；網站的「政府標案得標」分頁與每日新名單讀這裡。
# 公司成立日、資本額查商工登記補（fill-founded.mjs --source pcc）。排在每日新名單（03:17）之前。
#
# 使用者（2026/10/24）：「在現有的電推系統新增一個案源來源『政府標案得標廠商』…每天跑前一天的日期；週末、國定假日沒資料屬正常」。
name: 每日政府標案得標

on:
  schedule:
    - cron: '17 18 * * *'   # 台灣 02:17（GitHub 排程會延後兩三小時，仍在 03:17 的每日新名單之前）
  workflow_dispatch:
    inputs:
      date:
        description: '抓哪一天的決標公告（YYYYMMDD；空白＝台灣的昨天）'
        required: false
        default: ''
      days:
        description: '一次往回抓幾天（手動補抓用；空白＝1）'
        required: false
        default: '1'
      founded_minutes:
        description: '查商工登記最多跑幾分鐘'
        required: false
        default: '30'

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: daily-pcc
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 抓決標公告
        env:
          DATE: ${{ inputs.date || '' }}
          DAYS: ${{ inputs.days || '1' }}
        run: |
          node tools/fetch-pcc.mjs --date "$DATE" --days "$DAYS" | tee fetch-pcc.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fetch-pcc.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 補上公司成立日與資本額
        continue-on-error: true
        env:
          MINUTES: ${{ inputs.founded_minutes || '30' }}
        run: |
          node tools/fill-founded.mjs --source pcc --minutes "$MINUTES" --concurrency 4 | tee fill-founded.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fill-founded.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A leads/pcc
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "政府標案得標名單：$(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
