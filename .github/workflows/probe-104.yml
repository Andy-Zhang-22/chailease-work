# 一次性探路：104 職缺搜尋在 Actions 上抓不抓得到（tools/probe-104.mjs）。只印欄位與筆數。看完就刪。
name: 探路 104

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/probe-104.mjs
