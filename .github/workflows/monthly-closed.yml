# 每月抓已停業的公司：財政部稅籍的「停業」（每日）、「非營業中」（每月）與健保署「停歇業投保單位」（每年一檔），
# 只留新北市、臺北市 → leads/closed/closed.csv；六個名單分頁自動藏這些，客戶名單上標「已停業」。排在電子發票之後一天。
name: 每月已停業名單

on:
  schedule:
    - cron: '0 20 11 * *'   # 每月 12 日台灣 04:00
  workflow_dispatch:
    inputs:
      cities:
        description: '留哪些縣市（逗號分隔）'
        required: false
        default: '新北市,臺北市'
      years:
        description: '非營業中那份只留設立幾年內的'
        required: false
        default: '30'

permissions:
  contents: write

concurrency:
  group: monthly-closed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓稅籍停業、非營業中、健保停歇業
        env:
          CITIES: ${{ inputs.cities || '新北市,臺北市' }}
          YEARS: ${{ inputs.years || '30' }}
        run: |
          node tools/fetch-closed.mjs --cities "$CITIES" --years "$YEARS" | tee fetch-closed.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fetch-closed.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A leads/closed
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "已停業名單：$(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
