name: 探路：商業登記頁的序號
on:
  push:
    branches: [claude/telemarketing-website-hf2uwj]
    paths: [tools/probe-bankey.mjs, .github/workflows/probe-bankey.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/probe-bankey.mjs
