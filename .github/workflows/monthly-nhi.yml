# 每月抓健保署的「全民健康保險新成立投保單位資料」（data.gov.tw 26769），只留新北市、最近幾個月，
# 寫成 leads/nhi/nhi.csv；網站的「剛開始請人」分頁讀這裡。電話拿統編對貿易署的電話表（leads/trade/phones.csv），
# 資本額查商工登記補（fill-founded.mjs --source nhi）。排在出進口廠商之後一天，電話表才是新的。
name: 每月健保新投保單位

on:
  schedule:
    - cron: '0 20 9 * *'   # 每月 10 日台灣 04:00
  workflow_dispatch:
    inputs:
      cities:
        description: '留哪些縣市（逗號分隔）'
        required: false
        default: '新北市'
      months:
        description: '留最近幾個月成立投保單位的'
        required: false
        default: '6'
      skip_fetch:
        description: '只補資本額，不重抓'
        type: boolean
        required: false
        default: false
      founded_minutes:
        description: '查商工登記最多跑幾分鐘（查不完下次接著查）'
        required: false
        default: '240'

permissions:
  contents: write
  actions: write

concurrency:
  group: monthly-nhi
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓健保新成立投保單位
        if: inputs.skip_fetch != true
        env:
          CITIES: ${{ inputs.cities || '新北市' }}
          MONTHS: ${{ inputs.months || '6' }}
        run: |
          node tools/fetch-nhi.mjs --cities "$CITIES" --months "$MONTHS" | tee fetch-nhi.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fetch-nhi.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 補上資本額（與沒有的成立日）
        id: founded
        continue-on-error: true
        env:
          MINUTES: ${{ inputs.founded_minutes || '240' }}
        run: |
          node tools/fill-founded.mjs --source nhi --minutes "$MINUTES" --concurrency 6 | tee fill-founded.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fill-founded.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A leads/nhi
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "剛開始請人名單：$(date -u +%Y-%m-%d)"
          # leads/nhi 整份是這次重算的，跟分支上的舊檔撞到一律用這次的（第一次跑就撞到佔位檔，整輪白跑）
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: 還沒查完，再排一輪
        if: steps.founded.outputs.timeout == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.founded_minutes || '240' }}
        run: |
          echo "還剩 ${{ steps.founded.outputs.remaining }} 家，再排一輪"
          gh workflow run monthly-nhi.yml --ref "$GITHUB_REF_NAME" -f skip_fetch=true -f founded_minutes="$MINUTES"
