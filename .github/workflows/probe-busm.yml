name: 探路：商業每月設立／變更清冊
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: node tools/probe-busm.mjs 2>&1 | tee probe.txt
      - run: |
          { echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
