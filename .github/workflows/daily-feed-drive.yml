# 每日新名單在後台挑（tools/feed-drive.mjs，版本 321）：每天台灣清晨 05:00，在商工登記更新（05:30）之前（版本 333 對調）。
#
# 使用者：「每日新名單＋補電話：挑今天的新名單、查 Google 地圖電話、沒電話的跳過，5 點做完寫進同步檔」→「Ok」。
# 做法：Actions 上開無頭的 Chromium 打開網站本身，用服務帳號的權杖同步使用者雲端硬碟的名單，
# 叫網站自己的 dailyFeed 挑今天的新名單、補電話，再同步回去。跟使用者手機上跑的是同一份程式。
# 每月 1 日順便把「找不到電話」收起來的公司用 Google 地圖再查一次（只提醒，不放回），並把主力客戶拿去上網查擴張訊號（版本 328）。
#
# 需要：
#   Actions 變數 GCP_WIF_PROVIDER＋GCP_SERVICE_ACCOUNT（跟商工登記更新同一組）
#   Secrets PLACES_API_KEY：Google 地圖的金鑰（跟網站設定裡填的同一把；有「網站限制」也可以，請求會帶網站的 Referer）
#   Claude（版本 322）兩種擇一，都沒設就不上網查訊號、其他照舊：
#     Secrets ANTHROPIC_API_KEY（使用者目前用這個）
#     或 Workload Identity 聯合（不放金鑰）：Actions 變數 ANTHROPIC_FEDERATION_RULE_ID、ANTHROPIC_ORGANIZATION_ID、ANTHROPIC_SERVICE_ACCOUNT_ID
#       （Claude 主控台「Workload identity」建的規則；規則對準 main 分支，所以只有排程查得到）
# 模式：report＝整套照跑但不寫回（只看筆數）；write＝寫回。排程用 write；手動執行可以選。
name: 每日新名單（雲端硬碟名單）

on:
  schedule:
    - cron: '0 21 * * *'   # 台灣 05:00（版本 333 跟商工登記對調：先挑好，05:30 的商工登記更新同一天就查得到新名單）
  workflow_dispatch:
    inputs:
      mode:
        description: 'report＝只跑不寫回；write＝寫回雲端硬碟'
        required: false
        default: 'report'
        type: choice
        options: [report, write]
      nophone:
        description: '找不到電話的再查 Google：auto＝每月 1 日；yes＝這次查；no＝不查'
        required: false
        default: 'auto'
        type: choice
        options: [auto, 'yes', 'no']
      recheck:
        description: '主力客戶上網查擴張訊號：auto＝每月 1 日；yes＝這次查；no＝不查（一個月最多 120 家）'
        required: false
        default: 'auto'
        type: choice
        options: [auto, 'yes', 'no']
      research:
        description: '每日新名單候選要不要上網查擴張訊號（版本 349 起預設 no）'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']
      recheckmax:
        description: '主力客戶一次查幾家（配 recheck=yes；預設 260）'
        required: false
        default: '260'
        type: string
      recheckmodel:
        description: '主力客戶用哪個模型（預設 opus）'
        required: false
        default: 'opus'
        type: choice
        options: [opus, sonnet]
      model:
        description: '查訊號用哪個模型：sonnet＝平常；opus＝試試看（約 2 倍價）'
        required: false
        default: 'sonnet'
        type: choice
        options: [sonnet, opus]
      compare:
        description: '比較模式：不管今天挑過沒再挑一批、不寫回（要配 mode=report），看另一個模型查到幾家訊號'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']

permissions:
  contents: read
  id-token: write   # Workload Identity 聯盟要用 GitHub 的 OIDC token 去換 Google 的

concurrency:
  group: registry-drive   # 跟商工登記更新排同一條，不會同時寫同一個檔
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 每月 1 日多查主力客戶 120 家約 10 分鐘；手動一次查 380 家（Opus）要 45 分鐘以上（版本 350）
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 網站本身不需要任何套件，只有跑無頭瀏覽器要
      - name: 裝 Playwright 與 Chromium
        run: npm i --no-save playwright@1.63.0 @anthropic-ai/sdk && npx playwright install --with-deps chromium

      - name: 用 Workload Identity 聯盟換 Google 存取權杖（有設 GCP_WIF_PROVIDER 才跑）
        id: auth
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false

      # Claude 的身分聯合：跟 GitHub 要一次性的 OIDC token 寫進檔案，SDK 自己拿去換短效權杖（規則對準 main 分支）
      - name: 跟 GitHub 要 OIDC token 給 Claude（有設 ANTHROPIC_FEDERATION_RULE_ID 才跑）
        if: vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/anthropic-jwt"

      - name: 開網站挑今天的新名單、補電話、寫回雲端硬碟
        env:
          TZ: Asia/Taipei
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID != '' && format('{0}/anthropic-jwt', runner.temp) || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          MODE: ${{ inputs.mode || 'write' }}
          NOPHONE: ${{ inputs.nophone || 'auto' }}
          RECHECK: ${{ inputs.recheck || 'auto' }}
          INTEL_MODEL: ${{ inputs.model || 'sonnet' }}
          COMPARE: ${{ inputs.compare || 'no' }}
          RECHECK_MAX: ${{ inputs.recheckmax || '260' }}
          RECHECK_MODEL: ${{ inputs.recheckmodel || 'opus' }}
          RESEARCH: ${{ inputs.research || 'no' }}
        run: node tools/feed-drive.mjs --mode "$MODE" --nophone "$NOPHONE" --recheck "$RECHECK" --model "$INTEL_MODEL" --compare "$COMPARE"
