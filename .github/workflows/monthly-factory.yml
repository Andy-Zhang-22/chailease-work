# 每月抓經濟部「生產中工廠清冊」（data.gov.tw 6569），只留新北市、臺北市、最近 12 個月登記的工廠，
# 寫成 leads/factory/factory.csv；網站的「新設工廠」分頁讀這裡。電話拿統編對貿易署的電話表（leads/trade/phones.csv），
# 公司成立日、資本額查商工登記補（fill-founded.mjs --source factory）。清冊約每月 18 日更新，排在 20 日。
name: 每月新設工廠

on:
  schedule:
    - cron: '0 20 19 * *'   # 每月 20 日台灣 04:00
  workflow_dispatch:
    inputs:
      cities:
        description: '留哪些縣市（逗號分隔）'
        required: false
        default: '新北市,臺北市'
      months:
        description: '留最近幾個月登記的工廠'
        required: false
        default: '12'
      skip_fetch:
        description: '只補資本額與成立日，不重抓'
        type: boolean
        required: false
        default: false
      founded_minutes:
        description: '查商工登記最多跑幾分鐘（查不完下次接著查）'
        required: false
        default: '240'

permissions:
  contents: write
  actions: write

concurrency:
  group: monthly-factory
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓生產中工廠清冊
        if: inputs.skip_fetch != true
        env:
          CITIES: ${{ inputs.cities || '新北市,臺北市' }}
          MONTHS: ${{ inputs.months || '12' }}
        run: |
          node tools/fetch-factory.mjs --cities "$CITIES" --months "$MONTHS" | tee fetch-factory.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fetch-factory.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 補上公司成立日與資本額
        id: founded
        continue-on-error: true
        env:
          MINUTES: ${{ inputs.founded_minutes || '240' }}
        run: |
          node tools/fill-founded.mjs --source factory --minutes "$MINUTES" --concurrency 6 | tee fill-founded.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fill-founded.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A leads/factory
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "新設工廠名單：$(date -u +%Y-%m-%d)"
          # leads/factory 整份是這次重算的，跟分支上的舊檔撞到一律用這次的（第一次跑就撞到佔位檔，整輪白跑）
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: 還沒查完，再排一輪
        if: steps.founded.outputs.timeout == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.founded_minutes || '240' }}
        run: |
          echo "還剩 ${{ steps.founded.outputs.remaining }} 家，再排一輪"
          gh workflow run monthly-factory.yml --ref "$GITHUB_REF_NAME" -f skip_fetch=true -f founded_minutes="$MINUTES"
