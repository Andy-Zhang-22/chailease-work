name: 探路：核准對外投資（一次性）
on:
  push:
    branches: [claude/telemarketing-website-hf2uwj]
    paths: [tools/probe-ofi.mjs, .github/workflows/probe-ofi.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/probe-ofi.mjs
