# 每月抓經濟部國際貿易署的「出進口廠商登記資料」（data.gov.tw 79641），只留新北市，寫成
# 電話表（leads/trade/phones.csv，給補電話用）與最近登記的名單（leads/trade/trade.csv）；網站的「出進口廠商」分頁讀這裡。
#
# 使用者：「政府採購決標公告、出進口廠商登記這兩個做看看」。這份是全國唯一有公司電話的公開整批檔。
# 為什麼在 GitHub Actions：檔案 103 MB、開發環境連不上政府網站；只有 Actions 出得去。檔案每天更新，每月抓一次夠用。
name: 每月出進口廠商

on:
  schedule:
    - cron: '0 20 8 * *'   # 每月 9 日台灣 04:00（在商行、公司清冊之後一天）
  workflow_dispatch:
    inputs:
      cities:
        description: '留哪些縣市（逗號分隔）'
        required: false
        default: '新北市'
      months:
        description: '名單留原始登記在最近幾個月內的'
        required: false
        default: '24'
      skip_fetch:
        description: '只補成立年，不重抓'
        type: boolean
        required: false
        default: false
      founded_minutes:
        description: '查成立年最多跑幾分鐘（查不完下次接著查）'
        required: false
        default: '240'

permissions:
  contents: write
  actions: write   # 時間到還沒查完，自己再排下一輪

concurrency:
  group: monthly-trade
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓出進口廠商登記資料
        if: inputs.skip_fetch != true
        env:
          CITIES: ${{ inputs.cities || '新北市' }}
          MONTHS: ${{ inputs.months || '24' }}
        run: |
          node tools/fetch-trade.mjs --cities "$CITIES" --months "$MONTHS" | tee fetch-trade.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fetch-trade.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      # 貿易署的檔沒有成立日期。拿統編查商工登記填進「成立日期」欄（使用者：「出進口廠商能補上成立年嗎」）；
      # 查到的存 leads/trade/founded.json，時間到就收工存檔，下次接著查。
      - name: 補上成立年
        id: founded
        continue-on-error: true
        env:
          MINUTES: ${{ inputs.founded_minutes || '240' }}
        run: |
          node tools/fill-founded.mjs --source trade --minutes "$MINUTES" --concurrency 6 | tee fill-founded.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fill-founded.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A leads/trade
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "出進口廠商名單：$(date -u +%Y-%m-%d)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # GitHub 一個工作最多 6 小時。時間到還有剩的，存好之後自己再排一輪接著查，跑到完為止。
      - name: 還沒查完，再排一輪
        if: steps.founded.outputs.timeout == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.founded_minutes || '240' }}
        run: |
          echo "還剩 ${{ steps.founded.outputs.remaining }} 家，再排一輪"
          gh workflow run monthly-trade.yml --ref "$GITHUB_REF_NAME" -f skip_fetch=true -f founded_minutes="$MINUTES"
