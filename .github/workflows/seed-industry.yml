# 一次性：在工作分支上補抓第二批（食品工廠、環保列管）（之後由 monthly-industry.yml 每月跑）。用完刪。 
name: 一次性：產業名單第二批
on:
  push:
    branches: [claude/telemarketing-website-hf2uwj]
    paths: [.github/workflows/seed-industry.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/fetch-industry.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A leads/industry
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "產業名單：加食品工廠、環保列管（$(date -u +%Y-%m-%d)）"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
