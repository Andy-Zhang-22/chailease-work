# 一次性探路：Claude API＋網路搜尋（tools/intel.mjs）在 Actions 上接得通嗎。拿一家公開的上市公司試一筆，只印有沒有訊號、幾個來源。看完就刪。
name: 探路 Claude 網路搜尋

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save @anthropic-ai/sdk
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node --input-type=module -e "
          import { researchCompanies } from './tools/intel.mjs';
          const r = await researchCompanies([{ key: '22099131', name: '台灣積體電路製造股份有限公司', taxId: '22099131', address: '新竹市力行六路8號' }], { apiKey: process.env.ANTHROPIC_API_KEY, log: (m) => console.log(m) });
          const x = r.results['22099131'];
          console.log('asked', r.asked, 'withSignals', r.withSignals, 'failed', r.failed, 'result', x ? JSON.stringify({ expansion: x.expansion, score: x.score, summaryLen: x.summary.length, sources: x.sources.length }) : null);
          "
