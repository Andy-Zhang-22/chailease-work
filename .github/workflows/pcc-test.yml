# 政府電子採購網決標公告的可行性測試（pcc_test/，跟電推系統無關）。只手動觸發；結果寫回 pcc_test/。
name: pcc 決標測試
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'probe＝探路（只印結構）；scrape＝抓前 20 筆寫 result.csv'
        required: false
        default: 'probe'
        type: choice
        options: [probe, scrape]
permissions:
  contents: write
jobs:
  pcc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 裝 Playwright 與 Chromium
        run: pip install playwright && playwright install --with-deps chromium
      - name: 來源探路（第六輪起：直接打找到的決標開放資料）
        if: ${{ (inputs.step || 'probe') == 'probe' }}
        run: python pcc_test/probe_sources.py 2>&1 | tee pcc_test/run-log.txt
      - name: 網頁抓取（採購網從 GitHub 連會被境外封鎖，只有 scrape 才跑）
        if: ${{ (inputs.step || 'probe') == 'scrape' }}
        env:
          STEP: ${{ inputs.step || 'probe' }}
        run: python pcc_test/scrape_awards.py --step "$STEP" 2>&1 | tee pcc_test/run-log.txt
      - name: 結果寫回 pcc_test/
        if: always()
        run: |
          git add pcc_test/run-log.txt pcc_test/result.csv 2>/dev/null || git add pcc_test/run-log.txt
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "pcc 決標測試：$(date -u +%Y-%m-%d) $STEP"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
        env:
          STEP: ${{ inputs.step || 'probe' }}
