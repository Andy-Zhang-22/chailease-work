# 一次性（用完就刪）：在開發分支上先抓一次新設工廠名單，網站分頁才有資料可看。之後由 monthly-factory.yml 每月跑。
name: 先抓一次新設工廠
on:
  push:
    branches: [claude/telemarketing-website-hf2uwj]
    paths: [.github/workflows/seed-factory.yml]
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/fetch-factory.mjs --cities 新北市,臺北市 --months 12
      - run: node tools/fill-founded.mjs --source factory --minutes 40 --concurrency 6
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A leads/factory
          git commit -m "新設工廠名單：先抓一次" || exit 0
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
