# 探路（一次性）：上市櫃公司基本資料 API 與負責人查詢。看完連同腳本一起刪。
name: 探路：上市櫃公司
on:
  push:
    branches: [claude/telemarketing-website-hf2uwj]
    paths: ['tools/probe-listed.mjs', '.github/workflows/probe-listed.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 探路
        run: node tools/probe-listed.mjs 2>&1 | tee probe.txt
      - name: 把結果印在執行紀錄上
        run: |
          { echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
