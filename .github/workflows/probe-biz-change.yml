name: 探路：商業最近異動日期
on:
  push:
    branches: [claude/telemarketing-website-hf2uwj]
    paths: ['tools/probe-biz-change.mjs', '.github/workflows/probe-biz-change.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/probe-biz-change.mjs 2>&1 | tee probe.txt
