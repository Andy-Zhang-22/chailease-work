name: 探路：線上網站現在給的是哪一份
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://andy-zhang-22.github.io/chailease-work/leads/nhi/index.json?t=$(date +%s)" "https://andy-zhang-22.github.io/chailease-work/leads/nhi/index.json" "https://andy-zhang-22.github.io/chailease-work/version.json?t=$(date +%s)"; do
            echo "=== $u"; curl -sS -D - "$u" | head -c 1200; echo
          done
          echo "=== nhi.csv 列數"; curl -sS "https://andy-zhang-22.github.io/chailease-work/leads/nhi/nhi.csv?t=$(date +%s)" | wc -l
