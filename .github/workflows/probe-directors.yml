# 一次性探測（用完就刪）：商工登記董監事裡的境外法人。見 tools/probe-directors.mjs。
name: 探測董監事境外法人
on:
  push:
    branches: [claude/telemarketing-website-hf2uwj]
    paths: [tools/probe-directors.mjs, .github/workflows/probe-directors.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/probe-directors.mjs
