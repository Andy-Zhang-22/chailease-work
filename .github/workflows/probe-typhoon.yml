# 一次性探路（看完就刪）：新北市宣布停班了但程式沒認出來，印新北市那格的原文（公告是公開資訊，沒有個資）
name: 探路：停班公告原文
on:
  push:
    paths: ['.github/workflows/probe-typhoon.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -L -A "Mozilla/5.0" -o body.txt --max-time 40 https://www.dgpa.gov.tw/typh/daily/nds.html
          grep -n '更新時間' body.txt | sed 's/^[[:space:]]*//'
          n=$(grep -n '新北市</FONT>' body.txt | head -1 | cut -d: -f1); sed -n "$((n-3)),$((n+12))p" body.txt | sed 's/^[[:space:]]*//'
