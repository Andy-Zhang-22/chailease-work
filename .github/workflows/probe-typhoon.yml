# 一次性探路（看完就刪）：人事行政總處「天然災害停止上班及上課情形」有沒有機器能讀的格式。只印狀態碼、大小、含關鍵字的行。
name: 探路：停班公告
on:
  push:
    paths: ['.github/workflows/probe-typhoon.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -L -A "Mozilla/5.0" -o body.txt --max-time 40 https://www.dgpa.gov.tw/typh/daily/nds.html
          echo "bytes $(wc -c < body.txt)"
          grep -n -i -E '時間|更新|today|date' body.txt | sed 's/^\([0-9]*\):[[:space:]]*/\1: /' | head -20
          echo "=== table around 新北市"
          sed -n 320,420p body.txt | sed 's/^[[:space:]]*//' | grep -v '^$'
