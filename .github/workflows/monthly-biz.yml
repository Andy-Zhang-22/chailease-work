# 每月抓財政部「全國營業（稅籍）登記資料」，篩出新北市的商行、企業社（獨資、合夥），再拿新北市政府的
# 「新北市商業登記清冊」對出負責人，放進 leads/biz/；網站的「商行／企業社」分頁讀這裡。
#
# 使用者：「我想找商行或企業社的老闆做企金推廣，可以怎麼找名單」。
# 為什麼在 GitHub Actions：檔案 322 MB、開發環境連不上政府網站；只有 Actions 出得去。財政部每月初換新檔。
name: 每月商行／企業社

on:
  schedule:
    - cron: '0 20 6 * *'   # 每月 7 日台灣 04:00
  workflow_dispatch:
    inputs:
      cities:
        description: '留哪些縣市（逗號分隔；負責人只有新北市對得到）'
        required: false
        default: '新北市'
      min_capital:
        description: '資本額下限（元）'
        required: false
        default: '500000'

permissions:
  contents: write

concurrency:
  group: monthly-biz
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓稅籍登記、篩商行／企業社、對負責人
        env:
          CITIES: ${{ inputs.cities || '新北市' }}
          MIN_CAPITAL: ${{ inputs.min_capital || '500000' }}
        run: |
          node tools/fetch-biz.mjs --cities "$CITIES" --min-capital "$MIN_CAPITAL" | tee fetch-biz.log
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"; cat fetch-biz.log >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A leads/biz
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "商行／企業社名單：$(date -u +%Y-%m-%d)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
