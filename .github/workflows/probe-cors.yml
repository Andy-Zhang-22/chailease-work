# 一次性探測（用完就刪）：g0v 公司資料 API 給不給瀏覽器跨網域讀（CORS）。查的是台積電（公開資料）。
name: 探測 g0v CORS
on:
  push:
    branches: [claude/telemarketing-website-hf2uwj]
    paths: [.github/workflows/probe-cors.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -o /dev/null -D - -H 'Origin: https://andy-zhang-22.github.io' 'https://company.g0v.ronny.tw/api/show/22099131' | grep -i -E '^HTTP|access-control|content-type'
          echo '--- preflight'
          curl -sS -o /dev/null -D - -X OPTIONS -H 'Origin: https://andy-zhang-22.github.io' -H 'Access-Control-Request-Method: GET' 'https://company.g0v.ronny.tw/api/show/22099131' | grep -i -E '^HTTP|access-control'
