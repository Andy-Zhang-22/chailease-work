name: 探路：findbiz 商業頁面網址（Chromium）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node tools/probe-findbiz.mjs 2>&1 | tee probe.txt
      - run: |
          { echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
